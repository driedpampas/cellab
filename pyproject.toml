[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cellab"
version = "0.3.0"
description = "Describe cellular automata in files, simulate them, and answer questions about them."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pydantic>=2.6", "pillow>=10.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
cellab = "cellab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
